<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="parent_container">
        <div class="logincard">
            <span class="title">
                Login
            </span>
            <div class="iboxholder">
                <input type="text" class="txt_box" placeholder="Username/Emailid" name="" id="">
                <input type="password" class="txt_box" placeholder="Password" name="" id="">
            </div>

            <input type="button" class="btn" value="Login">

            <div class="metainfo">
                <span id="signup">No Account? Create one <a href="http://">Signup</a></span>
                <span id="forgotpassword">
                    <a href="http://">Forgot Password</a>
                </span>
            </div>
        </div>
    </div>
</body>

</html>
