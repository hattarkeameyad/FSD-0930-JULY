<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <div class="logincard">
            <div class="imageholder">

            </div>
            <div class="login_material">

                <div class="admintitleinfo">
                    <span id="adminheader">
                        Admin Portal Sign in.
                    </span>
                    <span id="adminmetainfo">
                        Please enter your admin credentials to access your dashboard.
                    </span>
                </div>
                <div class="component_holder">
                    <div class="emailaddress">
                        <label for="email-id"> Email <span class="marking">*</span></label>
                        <input type="email" name="" id="emailid" class="ibox">
                    </div>
                    <div class="password">
                        <label for="password"> Password <span class="marking">*</span></label>
                        <input type="password" name="" id="password" class="ibox">
                    </div>
                    <div class="buttonholder">
                        <input id="sign_in" type="submit" value="Sign in to Admin ">

                    </div>
                </div>
                <div class="button"></div>
            </div>
        </div>
    </div>

</body>

</html>
